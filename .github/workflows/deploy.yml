name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The frontend is a static SPA; it reaches the Convex backend over HTTP, so the
    # deployment addresses must be baked in at build time. Configure them as
    # repository variables (Settings > Secrets and variables > Actions > Variables):
    #   CONVEX_SITE_URL  (required)  – HTTP actions URL, https://<deployment>.convex.site
    #   CONVEX_URL       (optional)  – client URL, https://<deployment>.convex.cloud
    #                                  (only needed if you add queries/mutations)
    env:
      VITE_CONVEX_SITE_URL: ${{ vars.CONVEX_SITE_URL }}
      VITE_CONVEX_URL: ${{ vars.CONVEX_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify backend URL is configured
        run: |
          if [ -z "$VITE_CONVEX_SITE_URL" ]; then
            echo "::error::Repository variable CONVEX_SITE_URL is not set (expected https://<deployment>.convex.site)."
            exit 1
          fi
          case "$VITE_CONVEX_SITE_URL" in
            https://*.convex.site) ;;
            *) echo "::error::CONVEX_SITE_URL must look like https://<deployment>.convex.site"; exit 1 ;;
          esac

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify backend URL baked into bundle
        run: |
          if ! grep -rq "convex.site" dist/assets/; then
            echo "::error::Built bundle does not contain the Convex site URL."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
